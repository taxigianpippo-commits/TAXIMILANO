<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Taxi Milano</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-dark);
            padding: 1rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        main {
            flex: 1;
            padding: 1rem;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .btn {
            background-color: var(--accent);
            color: var(--text-main);
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: var(--card-dark);
            border: 1px solid var(--text-muted);
            color: var(--text-main);
            margin-top: 1rem;
        }

        .card {
            background-color: var(--card-dark);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
            padding: 1rem;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: var(--card-dark);
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            transform: scale(0.95);
            transition: transform 0.3s;
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        input[type="text"],
        input[type="number"] {
            background-color: var(--bg-dark);
            color: var(--text-main);
            border: 1px solid #334155;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.1rem;
            flex: 1;
            width: 100%;
            text-align: center;
        }
        
        #gps-result {
            margin-top: 1rem;
            padding: 1rem;
            background-color: var(--bg-dark);
            border-radius: 12px;
            border: 1px solid var(--success);
            color: var(--success);
            font-weight: 600;
            font-size: 1.1rem;
            width: 100%;
            display: none;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .btn-large {
            padding: 1.5rem;
            font-size: 1.2rem;
        }

        .rides-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .ride-item {
            background-color: var(--card-dark);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--accent);
        }

        .ride-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .ride-time {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .ride-route {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .ride-amount {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--success);
        }

        .nav-tabs {
            display: flex;
            background-color: var(--card-dark);
            border-radius: 12px;
            padding: 0.5rem;
            margin-bottom: 1rem;
            gap: 0.5rem;
            position: sticky;
            top: 70px;
            z-index: 9;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            transition: all 0.2s;
        }
