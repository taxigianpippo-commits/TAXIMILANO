<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi Milano</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #fbbf24;
            margin-bottom: 20px;
        }
        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        h2 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            text-align: center;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }
        button:active {
            background-color: #1d4ed8;
        }
        input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
        }
        .result-box {
            border: 1px solid #10b981;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            color: #34d399;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🚖 Taxi Milano 🚖</h1>

    <div class="card">
        <h2>Indirizzo di Partenza</h2>
        <button onclick="rilevaPosizione()">Geolocalizzazione GPS</button>
        
        <div class="result-box" id="posizioneRilevata">
            Posizione Rilevata: In attesa...
        </div>

        <input type="text" id="campoIndirizzo" placeholder="La via apparirà qui...">
        
        <button onclick="inviaIndirizzo()">Invia</button>
    </div>

    <script>
        function rilevaPosizione() {
            const box = document.getElementById('posizioneRilevata');
            const input = document.getElementById('campoIndirizzo');

            if (!navigator.geolocation) {
                box.innerText = "GPS non supportato dal browser";
                return;
            }

            box.innerText = "Rilevamento in corso...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    // Chiamata a Nominatim per ottenere l'indirizzo
                    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`)
                        .then(response => response.json())
                        .then(data => {
                            if (data && data.address) {
                                // Estraiamo SOLO la strada (ignorando civico, cap, ecc.)
                                const via = data.address.road || data.address.pedestrian || data.address.street || "Via non trovata";
                                
                                box.innerText = "Via: " + via;
                                input.value = via;
                            } else {
                                box.innerText = "Indirizzo non trovato";
                            }
                        })
                        .catch(error => {
                            console.error(error);
                            box.innerText = "Errore di connessione al GPS";
                        });
                },
                (error) => {
                    box.innerText = "Permesso GPS negato o errore";
                },
                { enableHighAccuracy: true }
            );
        }

        function inviaIndirizzo() {
            const valore = document.getElementById('campoIndirizzo').value;
            if(!valore) {
                alert("Prima rileva la posizione o inserisci un indirizzo!");
                return;
            }
            alert("Indirizzo registrato: " + valore);
        }
    </script>

</body>
</html>
