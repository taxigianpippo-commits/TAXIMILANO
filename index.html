<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <style>
        :root {
            --bg-body: #090d16;
            --bg-card: #1e293b;
            --border-card: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #0f172a;
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border-card);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #60a5fa;
        }

        main {
            flex: 1;
            padding: 1rem;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .nav-tabs {
            display: flex;
            background: #0f172a;
            border-radius: var(--radius-md);
            padding: 0.3rem;
            margin-bottom: 1rem;
            gap: 0.2rem;
            position: sticky;
            top: 60px;
            z-index: 9;
            border: 1px solid var(--border-card);
            overflow-x: auto;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0.6rem 0.4rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            flex: 1;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--accent-primary);
            color: #ffffff;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            margin-bottom: 1rem;
        }

        .btn {
            background: var(--accent-primary);
            color: #ffffff;
            border: none;
            padding: 1rem;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-large {
            padding: 1.3rem;
            font-size: 1.1rem;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-card);
            color: var(--text-main);
            margin-top: 0.75rem;
        }
