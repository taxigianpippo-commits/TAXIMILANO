<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🚖 APP-TAXI GALBO' 🚖</title>
    <!-- Chart.js & SheetJS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-body: #090d16;
            --bg-card: #1e293b;
            --border-card: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #0f172a;
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border-card);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #60a5fa;
        }

        main {
            flex: 1;
            padding: 1rem;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .nav-tabs {
            display: flex;
            background: #0f172a;
            border-radius: var(--radius-md);
            padding: 0.3rem;
            margin-bottom: 1rem;
            gap: 0.2rem;
            position: sticky;
            top: 60px;
            z-index: 9;
            border: 1px solid var(--border-card);
            overflow-x: auto;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0.6rem 0.4rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            flex: 1;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--accent-primary);
            color: #ffffff;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            margin-bottom: 1rem;
        }

        .btn {
            background: var(--accent-primary);
            color: #ffffff;
            border: none;
            padding: 1rem;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-large {
            padding: 1.3rem;
            font-size: 1.1rem;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-card);
            color: var(--text-main);
            margin-top: 0.75rem;
        }

        .btn-danger {
            background: var(--danger);
        }

        .edit-btn {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 0.4rem 0.6rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        input[type="text"], input[type="number"], select {
            background: #0f172a;
            color: var(--text-main);
            border: 1px solid var(--border-card);
            padding: 1rem;
            border-radius: var(--radius-md);
            font-size: 1.1rem;
            width: 100%;
            text-align: center;
            outline: none;
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .keypad-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-card);
            color: var(--text-main);
            padding: 1rem;
            border-radius: var(--radius-md);
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-parking {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-mode {
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            padding: 1rem;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid var(--border-card);
            width: 100%;
            max-width: 420px;
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-align: center;
        }

        .rides-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .ride-item {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-md);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ride-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .ride-amount {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--success);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .summary-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            padding: 1rem;
            border-radius: var(--radius-md);
            text-align: center;
        }

        .summary-value {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--accent-primary);
            margin-top: 0.25rem;
        }

        .summary-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .progress-container {
            background: #0f172a;
            border-radius: 8px;
            height: 10px;
            width: 100%;
            margin-top: 0.75rem;
            overflow: hidden;
            border: 1px solid var(--border-card);
        }

        .progress-bar {
            background: var(--success);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-card);
            color: var(--text-muted);
            padding: 0.35rem 0.7rem;
            border-radius: 16px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 600;
        }

        .filter-btn.active {
            background: var(--accent-primary);
            color: #ffffff;
            border-color: var(--accent-primary);
        }
    </style>
</head>

<body>
    <header>
        <h1>🚖 APP-TAXI GALBO' 🚖</h1>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchSection('rides')">Corsa</button>
        <button class="tab-btn" onclick="switchSection('history')">Storico</button>
        <button class="tab-btn" onclick="switchSection('summary')">Totali</button>
        <button class="tab-btn" onclick="switchSection('stats')">Stats</button>
        <button class="tab-btn" onclick="switchSection('expenses')">Spese</button>
        <button class="tab-btn" onclick="switchSection('km-page')">KM & Tagliandi</button>
        <button class="tab-btn" onclick="switchSection('settings')">Altro</button>
    </div>

    <main>
        <!-- Nuova Corsa / Servizio -->
        <section id="rides-section" class="section active">
            <!-- Pulsante Inizio / Fine Servizio KM -->
            <div class="card" style="border-color: var(--accent-primary);">
                <h3 style="font-size: 0.95rem; margin-bottom: 0.5rem; text-align: center; color: #60a5fa;">Gestione Turno Lavoro</h3>
                <div id="service-status-box" style="text-align: center; margin-bottom: 0.75rem; font-size: 0.85rem; color: var(--text-muted);">
                    Stato: <strong>Fuori Servizio</strong>
                </div>
                <button id="service-action-btn" class="btn btn-large" onclick="openServiceModal()">Inizio Servizio 🟢</button>
            </div>

            <button id="new-ride-btn" class="btn btn-large" style="opacity: 0.5;" onclick="checkAndOpenStartRide()">Inizio Corsa
